name: Build NEONWAVE v4 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o neonwave_flutter_android.zip
          if [ -d "neonwave-android" ]; then cp -r neonwave-android/* .; fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Wrapper & Build APK
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/Man.xml || true
          flutter create --platforms=android .
          cp /tmp/Man.xml android/app/src/main/AndroidManifest.xml || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: NEONWAVE-v4-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
